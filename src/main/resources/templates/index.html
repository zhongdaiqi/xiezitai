<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title th:text="${searching ? '搜索「' + q + '」 - ' + siteHost : (pageNo > 1 ? '写字台 - 首页 - 第 ' + pageNo + ' 页' : '写字台 - 首页')}">写字台</title>
    <meta name="description" th:content="'写字台 ' + ${siteHost} + ' — 简洁、SEO 友好的自托管博客'">
    <!-- 站内搜索结果页不收录：这类页面是典型的「低质重复页」，放进去只会稀释首页权重 -->
    <meta name="robots" th:if="${searching}" content="noindex,follow">
    <!-- SEO：翻页用真实链接，并声明 canonical / prev / next，避免重复内容。
         搜索时链接里要带上 ?q=，否则点「下一页」搜索条件就丢了（homeUrl / pageUrlPrefix 由后端算好）。 -->
    <link rel="canonical" th:if="${pageNo == 1}" th:href="${homeUrl}">
    <link rel="canonical" th:if="${pageNo > 1}" th:href="${pageUrlPrefix + pageNo}">
    <link rel="prev" th:if="${pageNo > 1}" th:href="${pageNo == 2 ? homeUrl : pageUrlPrefix + (pageNo - 1)}">
    <link rel="next" th:if="${pageNo < totalPages}" th:href="${pageUrlPrefix + (pageNo + 1)}">
    <style>
        :root { --ink: #1a1a1a; --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); background: #fff; line-height: 1.7; }
        .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
        header { padding: 40px 0 24px; border-bottom: 1px solid var(--line); margin-bottom: 32px; }
        header h1 a { color: var(--ink); text-decoration: none; font-size: 28px; }
        header .sub { color: var(--muted); margin-top: 4px; font-size: 14px; }
        nav { margin-top: 12px; display: flex; gap: 16px; font-size: 14px; flex-wrap: wrap; }
        nav a { color: var(--accent); text-decoration: none; }
        article { margin-bottom: 40px; }
        article h2 a { color: var(--ink); text-decoration: none; font-size: 20px; }
        article h2 a:hover { color: var(--accent); }
        .meta { color: var(--muted); font-size: 13px; margin: 6px 0 10px; }
        .more { color: var(--accent); font-size: 14px; text-decoration: none; }
        footer { border-top: 1px solid var(--line); padding-top: 16px; color: var(--muted); font-size: 13px; }
        .prose p { margin: 8px 0; }
        /* 正文里的媒体自适应，避免大图/视频撑破 720px 正文栏 */
        .prose img, .prose video { max-width: 100%; height: auto; border-radius: 6px; }
        .prose video { display: block; margin: 12px 0; background: #000; }
        /* GFM 任务列表（摘要里也可能出现），与文章页保持一致；扩展不带 class，用 :has() 命中 */
        .prose ul:has(> li > input[type=checkbox]) { list-style: none; padding-left: 2px; }
        .prose li:has(> input[type=checkbox]) { list-style: none; }
        .prose li > input[type=checkbox] { margin-right: 7px; width: 15px; height: 15px;
            vertical-align: -2px; accent-color: var(--accent); }
        /* 分页条 */
        .empty { color: var(--muted); padding: 40px 0; text-align: center; }
        .pager { display: flex; align-items: center; justify-content: center; gap: 10px;
                 border-top: 1px solid var(--line); padding-top: 24px; margin-top: 8px; font-size: 14px; }
        .pager a, .pager span.dis { padding: 5px 11px; border-radius: 6px; text-decoration: none; }
        .pager a { color: var(--accent); }
        .pager a:hover { background: #f3f4f6; }
        .pager span.dis { color: #c7cbd3; }
        .pager .pages { display: flex; gap: 4px; }
        .pager .pages a.cur { background: var(--accent); color: #fff; font-weight: 600; }
        .pager .count { color: var(--muted); margin-left: 6px; font-size: 13px; }
        @media (max-width: 480px) { .pager .count { display: none; } }
        /* 站内搜索：普通 GET 表单（服务端渲染 / 可分享链接 / 无需 JS，对 SEO 与 AI 抓取都友好） */
        .search { display: flex; gap: 8px; margin-top: 16px; }
        .search input[type=search] { flex: 1; min-width: 0; font: inherit; color: var(--ink);
            background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
        .search input[type=search]:focus { outline: 2px solid rgba(37,99,235,.25); border-color: var(--accent); }
        .search button { flex: 0 0 auto; font: inherit; cursor: pointer; white-space: nowrap;
            color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 9px 16px; }
        .search button:hover { background: #1d4ed8; }
        .hit { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
               color: var(--muted); font-size: 14px; margin: -14px 0 28px; }
        .hit b { color: var(--ink); }
        .hit a { color: var(--accent); text-decoration: none; font-size: 13px; }
        .hit a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1><a href="/">写字台</a></h1>
        <div class="sub">写字台 <span th:text="${siteHost}">xiezitai.cn</span> · 把想法摊开来写</div>
        <nav>
            <a href="/">文章</a>
            <a th:each="p : ${navPages}" th:href="@{'/page/' + ${p.slug}}" th:text="${p.title}"></a>
            <a href="/admin.html">后台</a>
        </nav>
        <!-- 站内搜索：纯 GET 表单，服务端渲染出结果 —— 链接可分享、可被爬虫抓取，不依赖 JS -->
        <form class="search" method="get" action="/" role="search">
            <input type="search" name="q" th:value="${q}" aria-label="搜索文章"
                   placeholder="搜索文章（标题 / 正文 / 标签）" autocomplete="off">
            <button type="submit">搜索</button>
        </form>
    </header>

    <p class="hit" th:if="${searching}">
        <span>搜索 <b th:text="'「' + ${q} + '」'">「关键词」</b> · 命中 <b th:text="${totalArticles}">0</b> 篇</span>
        <a href="/">清除搜索</a>
    </p>

    <p class="empty" th:if="${#lists.isEmpty(articles)}"
       th:text="${searching ? '没有找到匹配「' + q + '」的文章，换个关键词试试。' : '还没有发布的文章。'}">还没有发布的文章。</p>

    <article th:each="a : ${articles}">
        <h2><a th:href="@{'/article/' + ${a.slug}}" th:text="${a.title}"></a></h2>
        <div class="meta">
            <span th:text="${a.author}"></span> ·
            <span th:text="${#temporals.format(a.publishedAt, 'yyyy-MM-dd')}"></span> ·
            <span th:text="${a.viewCount} + ' 次阅读'"></span>
        </div>
        <div class="prose" th:utext="${htmls[a.id]}"></div>
        <a class="more" th:href="@{'/article/' + ${a.slug}}">继续阅读 →</a>
    </article>

    <nav class="pager" th:if="${totalPages > 1}" aria-label="分页导航">
        <!-- 翻页链接一律带 ?q=（pageUrlPrefix 由后端拼好）；第 2 页的「上一页」回到不带 page 的首址 -->
        <a th:if="${pageNo > 1}" th:href="${pageNo == 2 ? homeUrl : pageUrlPrefix + (pageNo - 1)}" rel="prev">← 上一页</a>
        <span class="dis" th:unless="${pageNo > 1}">← 上一页</span>
        <span class="pages">
            <a th:each="p : ${pageNumbers}" th:href="${pageUrlPrefix + p}" th:text="${p}"
               th:classappend="${p == pageNo} ? 'cur'"
               th:attr="aria-current=${p == pageNo ? 'page' : null}"></a>
        </span>
        <a th:if="${pageNo < totalPages}" th:href="${pageUrlPrefix + (pageNo + 1)}" rel="next">下一页 →</a>
        <span class="dis" th:unless="${pageNo < totalPages}">下一页 →</span>
        <span class="count" th:text="${searching ? '共 ' + totalArticles + ' 篇匹配' : '共 ' + totalArticles + ' 篇'}"></span>
    </nav>

    <footer>© 2026 写字台 <span th:text="${siteHost}">xiezitai.cn</span> · Powered by Xiezitai</footer>
</div>
</body>
</html>
