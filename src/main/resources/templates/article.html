<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title th:text="${article.title + ' - 写字台'}">写字台</title>
    <meta name="description" th:content="${article.seoDescription != null ? article.seoDescription : article.summary}">
    <meta name="keywords" th:content="${article.seoKeywords}">
    <meta property="og:title" th:content="${article.title}">
    <meta property="og:type" content="article">
    <link rel="stylesheet" href="/vendor/github-markdown-css/github-markdown-light.min.css">
    <style>
        :root { --ink: #1a1a1a; --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); background: #fff; }
        .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
        .top { padding: 24px 0; border-bottom: 1px solid var(--line); margin-bottom: 32px; display: flex; justify-content: space-between; }
        .top a { color: var(--accent); text-decoration: none; font-size: 14px; }
        h1 { font-size: 26px; line-height: 1.4; }
        .meta { color: var(--muted); font-size: 13px; margin: 10px 0 8px; }
        .cover { max-width: 100%; border-radius: 6px; margin: 12px 0; }
        /* 正文里的媒体自适应（github-markdown-css 只管 img，video 需自己兜） */
        .markdown-body img, .markdown-body video { max-width: 100%; height: auto; border-radius: 6px; }
        .markdown-body video { display: block; margin: 12px 0; background: #000; }
        /* GFM 任务列表：commonmark 只输出 <li><input type="checkbox" disabled>，不带 class，
           所以用 :has() 命中「含复选框的 li」，去掉项目符号并给复选框留位 */
        .markdown-body ul:has(> li > input[type=checkbox]) { list-style: none; padding-left: 2px; }
        .markdown-body li:has(> input[type=checkbox]) { list-style: none; }
        .markdown-body li > input[type=checkbox] { margin-right: 7px; width: 15px; height: 15px;
            vertical-align: -2px; accent-color: var(--accent); }
        .markdown-body li > input[type=checkbox]:checked ~ * { color: var(--muted); }
        /* 评论区排版参考小红书：整体相对正文缩进，条目 = 圆形头像 + 右侧内容，条目间浅分隔线 */
        .comments { margin-left: 8px; }
        .comment { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid #f1f1f3; }
        .comment:last-of-type { border-bottom: 0; }
        .avatar { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%; display: flex;
                  align-items: center; justify-content: center; color: #fff; font-size: 15px;
                  font-weight: 600; user-select: none; }
        .av-0 { background: #ff6b81; } .av-1 { background: #ffa94d; } .av-2 { background: #4dabf7; }
        .av-3 { background: #38d9a9; } .av-4 { background: #9775fa; } .av-5 { background: #f783ac; }
        .comment .body { flex: 1; min-width: 0; }
        .comment .who { color: #9ca3af; font-size: 13px; margin-bottom: 5px; }
        .comment .who b { color: #6b7280; font-weight: 500; }
        .comment .text { font-size: 15px; line-height: 1.65; color: var(--ink); word-break: break-word; white-space: pre-wrap; }
        /* 层级：回复相对一级评论内容再缩进一档，形成阶梯（参考小红书） */
        .replies { margin-left: 16px; }
        .replies .comment { padding: 12px 0 0; border-bottom: 0; }
        .avatar.sm { width: 26px; height: 26px; flex: 0 0 26px; font-size: 12px; }
        .replies .who .at { color: var(--accent); }
        .reply-btn { background: none; border: 0; padding: 0; margin-top: 6px; font-size: 13px;
                     color: var(--muted); cursor: pointer; }
        .reply-btn:hover { color: var(--accent); }
        .reply-form { margin: 10px 0 4px; }
        .reply-form textarea { min-height: 64px; font-size: 14px; }
        .reply-form .msg { margin-left: 8px; }
        textarea { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 6px; padding: 10px; font: inherit; }
        button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 20px; cursor: pointer; margin-top: 8px; }
        input { border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-right: 8px; }
        .ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
        .userbox { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .userbox button { margin-top: 0; padding: 6px 14px; }
        .cmt-note { color: var(--muted); font-size: 13px; margin-top: 8px; }
        .cmt-box { border: 1px dashed var(--line); border-radius: 8px; padding: 16px; margin-top: 16px;
                   display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
        .cmt-box button { margin-top: 0; padding: 6px 16px; }
        .as-who { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
                 align-items: center; justify-content: center; padding: 16px; z-index: 50; }
        .modal.open { display: flex; }
        .modal-card { background: #fff; border-radius: 10px; padding: 20px; width: 100%; max-width: 360px; position: relative; }
        .modal-card input { width: 100%; margin: 0 0 10px; }
        .wide { width: 100%; margin-top: 4px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .tabs button { flex: 1; width: auto; background: #f3f4f6; color: var(--ink); margin-top: 0; }
        .tabs button.active { background: var(--accent); color: #fff; }
        .x { position: absolute; top: 10px; right: 14px; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; }
        .msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
        .msg.ok { color: #16a34a; } .msg.err { color: #b91c1c; }
        footer { border-top: 1px solid var(--line); margin-top: 40px; padding-top: 16px; color: var(--muted); font-size: 13px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <a href="/">← 写字台</a>
        <div class="userbox" id="userBox"></div>
    </div>
    <h1 th:text="${article.title}"></h1>
    <div class="meta">
        <span th:text="${article.author}"></span> ·
        <span th:text="${#temporals.format(article.publishedAt, 'yyyy-MM-dd HH:mm')}"></span> ·
        <span th:text="${article.viewCount} + ' 次阅读'"></span>
    </div>
    <img class="cover" th:if="${article.cover != null && !article.cover.isEmpty()}" th:src="${article.cover}" alt="cover">
    <div class="markdown-body" th:utext="${contentHtml}"></div>

    <h3 style="margin-top:48px;" id="comments">评论<span th:if="${commentCount > 0}" th:text="' · ' + ${commentCount}"></span></h3>
    <div class="comments">
        <p class="cmt-note" th:if="${#lists.isEmpty(comments)}">还没有评论，登录后来说两句。</p>
        <div class="comment" th:each="c : ${comments}" th:attr="data-id=${c.id},data-author=${c.authorName}">
            <div class="avatar" th:classappend="|av-${c.id % 6}|"
                 th:text="${!#strings.isEmpty(c.authorName) ? #strings.substring(c.authorName, 0, 1) : '?'}"></div>
            <div class="body">
                <div class="who"><b th:text="${c.authorName}"></b> · <span th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd')}"></span></div>
                <div class="text" th:text="${c.content}"></div>
                <button type="button" class="reply-btn" style="display:none;" onclick="openReply(this)">回复</button>

                <!-- 二级：回复列表，相对一级评论内容再缩进一档 -->
                <div class="replies" th:if="${!#lists.isEmpty(c.replies)}">
                    <div class="comment" th:each="r : ${c.replies}" th:attr="data-id=${r.id},data-author=${r.authorName}">
                        <div class="avatar sm" th:classappend="|av-${r.id % 6}|"
                             th:text="${!#strings.isEmpty(r.authorName) ? #strings.substring(r.authorName, 0, 1) : '?'}"></div>
                        <div class="body">
                            <div class="who"><b th:text="${r.authorName}"></b>
                                <span class="at" th:if="${!#strings.isEmpty(r.replyToName)}" th:text="'回复 @' + ${r.replyToName}"></span>
                                · <span th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd')}"></span></div>
                            <div class="text" th:text="${r.content}"></div>
                            <button type="button" class="reply-btn" style="display:none;" onclick="openReply(this)">回复</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 未登录：不出现输入框，只给登录/注册入口 -->
    <div class="cmt-box" id="loginHint" style="display:none;">
        <span>评论仅限登录用户发表</span>
        <button type="button" onclick="openAuth('login')">登录</button>
        <button type="button" class="ghost" onclick="openAuth('register')">注册</button>
    </div>

    <!-- 已登录：显示评论框 -->
    <form id="commentForm" onsubmit="submitComment(event)" style="margin-top:16px; display:none;">
        <div class="as-who">以 <b id="cmtAs"></b> 的身份评论</div>
        <textarea id="ccontent" placeholder="说点什么……"></textarea>
        <button type="submit">提交评论</button>
        <span class="msg ok" id="cmsg" style="margin-left:8px; display:inline-block;"></span>
        <p class="cmt-note">评论提交后需管理员审核通过才会公开展示。</p>
    </form>

    <footer>© 2026 写字台 xiezitai.cn</footer>
</div>

<!-- 登录 / 注册弹窗（复用后台同一套 JWT，token 存 localStorage 的 xz_token） -->
<div class="modal" id="authModal">
    <div class="modal-card">
        <span class="x" onclick="closeAuth()">&times;</span>
        <div class="tabs">
            <button type="button" id="tabLogin" class="active" onclick="switchAuth('login')">登录</button>
            <button type="button" id="tabReg" onclick="switchAuth('register')">注册</button>
        </div>

        <div id="paneLogin">
            <input id="au-user" placeholder="用户名" autocomplete="username">
            <input id="au-pass" type="password" placeholder="密码" autocomplete="current-password">
            <input id="au-totp" placeholder="动态验证码（开启两步验证才需要）" style="display:none;">
            <button type="button" class="wide" onclick="doAuthLogin()">登录</button>
        </div>

        <div id="paneReg" style="display:none;">
            <input id="ar-user" placeholder="用户名（至少 3 位）" autocomplete="username">
            <input id="ar-pass" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password">
            <input id="ar-email" placeholder="邮箱（可选，仅站长可见）" autocomplete="email">
            <button type="button" class="wide" onclick="doAuthRegister()">注册并登录</button>
        </div>

        <div class="msg" id="authMsg"></div>
    </div>
</div>
<script>
    /* 评论仅限登录用户：token 存 localStorage，与后台 admin.html 共用同一个 key（xz_token） */
    const TOKEN_KEY = 'xz_token';
    const slug = location.pathname.split('/').pop();
    let token = localStorage.getItem(TOKEN_KEY) || '';
    let currentUser = '';

    /* ---------- 登录态 ---------- */
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g,
            c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function setMsg(id, text, kind) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = text || '';
        el.className = 'msg' + (kind ? ' ' + kind : '');
    }
    async function refreshUser() {
        if (!token) { currentUser = ''; renderAuth(); return; }
        try {
            const r = await fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } });
            if (r.ok) {
                const d = await r.json();
                currentUser = d.username || '';
            } else {
                token = ''; localStorage.removeItem(TOKEN_KEY); currentUser = '';
            }
        } catch (e) { currentUser = ''; }
        renderAuth();
    }
    function renderAuth() {
        const box = document.getElementById('userBox');
        const hint = document.getElementById('loginHint');
        const form = document.getElementById('commentForm');
        if (currentUser) {
            box.innerHTML = '<span>👤 ' + esc(currentUser) + '</span>'
                + '<button type="button" class="ghost" onclick="logout()">退出</button>';
            hint.style.display = 'none';
            form.style.display = 'block';
            document.getElementById('cmtAs').textContent = currentUser;
        } else {
            box.innerHTML = '<button type="button" onclick="openAuth(\'login\')">登录</button>'
                + '<button type="button" class="ghost" onclick="openAuth(\'register\')">注册</button>';
            hint.style.display = 'flex';
            form.style.display = 'none';
            document.querySelectorAll('.reply-form').forEach(f => f.remove());
        }
        // 「回复」按钮只在登录后可用
        document.querySelectorAll('.reply-btn').forEach(b => { b.style.display = currentUser ? 'inline-block' : 'none'; });
    }
    function logout() {
        token = ''; currentUser = '';
        localStorage.removeItem(TOKEN_KEY);
        setMsg('cmsg', '', '');
        renderAuth();
    }

    /* ---------- 登录 / 注册弹窗 ---------- */
    function openAuth(mode) {
        switchAuth(mode || 'login');
        document.getElementById('authModal').classList.add('open');
    }
    function closeAuth() { document.getElementById('authModal').classList.remove('open'); }
    function switchAuth(mode) {
        const isLogin = mode !== 'register';
        document.getElementById('tabLogin').classList.toggle('active', isLogin);
        document.getElementById('tabReg').classList.toggle('active', !isLogin);
        document.getElementById('paneLogin').style.display = isLogin ? 'block' : 'none';
        document.getElementById('paneReg').style.display = isLogin ? 'none' : 'block';
        setMsg('authMsg', '', '');
    }

    async function doAuthLogin() {
        const username = document.getElementById('au-user').value.trim();
        const password = document.getElementById('au-pass').value;
        const totpCode = document.getElementById('au-totp').value.trim();
        if (!username || !password) return setMsg('authMsg', '请输入用户名和密码', 'err');
        const body = { username, password };
        if (totpCode) body.totpCode = totpCode;
        let res, data = {};
        try {
            res = await fetch('/api/auth/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
            });
            data = await res.json().catch(() => ({}));
        } catch (e) { return setMsg('authMsg', '网络异常，请重试', 'err'); }
        if (res.ok) {
            token = data.token;
            localStorage.setItem(TOKEN_KEY, token);
            document.getElementById('au-pass').value = '';
            document.getElementById('au-totp').value = '';
            closeAuth();
            await refreshUser();
            return;
        }
        if (data.error === 'NEED_TOTP') {
            document.getElementById('au-totp').style.display = 'block';
            document.getElementById('au-totp').focus();
            return setMsg('authMsg', data.message || '请输入动态验证码', 'err');
        }
        setMsg('authMsg', data.message || data.error || ('登录失败（HTTP ' + res.status + '）'), 'err');
    }

    async function doAuthRegister() {
        const username = document.getElementById('ar-user').value.trim();
        const password = document.getElementById('ar-pass').value;
        const email = document.getElementById('ar-email').value.trim();
        if (username.length < 3) return setMsg('authMsg', '用户名至少 3 位', 'err');
        if (password.length < 6) return setMsg('authMsg', '密码至少 6 位', 'err');
        let res, data = {};
        try {
            res = await fetch('/api/auth/register', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, email })
            });
            data = await res.json().catch(() => ({}));
        } catch (e) { return setMsg('authMsg', '网络异常，请重试', 'err'); }
        if (!res.ok) return setMsg('authMsg', data.message || data.error || ('注册失败（HTTP ' + res.status + '）'), 'err');
        // 注册成功直接接着登录，省一次输入
        document.getElementById('au-user').value = username;
        document.getElementById('au-pass').value = password;
        await doAuthLogin();
    }

    /* ---------- 提交评论（作者由服务端按登录账号决定，前端只传正文） ---------- */
    async function submitComment(e) {
        e.preventDefault();
        const content = document.getElementById('ccontent').value.trim();
        if (!content) return setMsg('cmsg', '评论内容不能为空', 'err');
        let res, data = {};
        try {
            res = await fetch('/api/articles/' + slug + '/comments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                body: JSON.stringify({ content })
            });
            data = await res.json().catch(() => ({}));
        } catch (err) { return setMsg('cmsg', '网络异常，请重试', 'err'); }
        if (res.ok) {
            document.getElementById('ccontent').value = '';
            setMsg('cmsg', data.message || '已提交，审核通过后展示', 'ok');
            return;
        }
        if (res.status === 401) {
            logout();                       // token 失效：退回未登录态
            setMsg('cmsg', '登录已过期，请重新登录后再评论', 'err');
            return;
        }
        setMsg('cmsg', data.message || data.error || ('提交失败（HTTP ' + res.status + '）'), 'err');
    }

    /* ---------- 回复（两级层级：回复一条回复时，服务端会把 parentId 收敛回同一根评论） ---------- */
    function openReply(btn) {
        const host = btn.closest('.comment');
        const body = host.querySelector('.body');
        const old = body.querySelector('.reply-form');
        if (old) { old.remove(); return; }           // 再次点击 = 收起
        const form = document.createElement('form');
        form.className = 'reply-form';
        const ta = document.createElement('textarea');
        ta.placeholder = '回复 @' + (host.dataset.author || '') + '……';
        const send = document.createElement('button');
        send.type = 'submit'; send.textContent = '回复';
        const cancel = document.createElement('button');
        cancel.type = 'button'; cancel.className = 'ghost'; cancel.textContent = '取消';
        cancel.addEventListener('click', () => form.remove());
        const msg = document.createElement('span');
        msg.className = 'msg';
        form.append(ta, send, cancel, msg);
        form.addEventListener('submit', e => submitReply(e, host.dataset.id, ta, msg));
        body.appendChild(form);
        ta.focus();
    }
    async function submitReply(e, parentId, ta, msg) {
        e.preventDefault();
        const content = ta.value.trim();
        if (!content) { msg.className = 'msg err'; msg.textContent = '内容不能为空'; return; }
        let res, data = {};
        try {
            res = await fetch('/api/articles/' + slug + '/comments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                body: JSON.stringify({ content, parentId })
            });
            data = await res.json().catch(() => ({}));
        } catch (err) { msg.className = 'msg err'; msg.textContent = '网络异常，请重试'; return; }
        if (res.ok) {
            ta.value = '';
            msg.className = 'msg ok';
            msg.textContent = data.message || '已提交，待审核后展示';
            return;
        }
        if (res.status === 401) {
            logout();
            msg.className = 'msg err'; msg.textContent = '登录已过期，请重新登录';
            return;
        }
        msg.className = 'msg err';
        msg.textContent = data.message || data.error || ('提交失败（HTTP ' + res.status + '）');
    }

    document.getElementById('authModal').addEventListener('click', e => {
        if (e.target.id === 'authModal') closeAuth();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAuth(); });
    renderAuth();
    refreshUser();
</script>
</body>
</html>
