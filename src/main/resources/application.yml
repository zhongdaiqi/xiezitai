server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: xiezitai
  datasource:
    # characterEncoding 必须是 Java 字符集名（UTF-8），不能写 MySQL 的 utf8mb4 ——
    # Connector/J 会把它映射成服务端 utf8mb4（8.0.13+），写成 utf8mb4 会直接启动失败：
    # "Unsupported character encoding 'utf8mb4'"。sslMode=DISABLED 是 8.x 的规范写法（旧写法 useSSL=false）。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:xiezitai}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&sslMode=DISABLED
    username: ${MYSQL_USER:xiezitai}
    password: ${MYSQL_PASSWORD:xiexiexie}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  thymeleaf:
    cache: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB

xiezitai:
  # 生产环境务必通过环境变量覆盖
  jwt-secret: ${XIEZITAI_JWT_SECRET:xiezitai-default-secret-change-me-0123456789abcdef}
  jwt-expire-hours: 72
  upload-dir: ${XIEZITAI_UPLOAD_DIR:./data/uploads}
  site-name: 写字台
  site-url: ${XIEZITAI_SITE_URL:https://xiezitai.cn}
  # 首次启动且文章/页面都为空时，写入一批示例内容（4 篇文章 + 关于/友链页面 + 几条评论），
  # 免得部署完打开首页只有一句「还没有发布的文章」。写过一次就打标记、不会重复写入，
  # 也不影响已经存在的库。不想要示例内容：XIEZITAI_SEED_DEMO=false
  seed-demo: ${XIEZITAI_SEED_DEMO:true}
  # 写字台⇄写字台导入：对方**站点自身文件**（视频/附件）的单文件上限，默认 64MB。
  # 站点自带视频常超过媒体库默认的 10MB，若沿用，命中「需求 2.3 要落盘」的文件会被拒收。
  # 超过此上限才降级为「保留外链 + 警告」。设 0 表示不限制（谨慎，防磁盘写满）。
  xz-import:
    max-media-bytes: ${XIEZITAI_XZ_MAX_MEDIA_BYTES:67108864}
  # 谷歌 Blogger：OAuth 2.0 客户端凭据**只从环境变量读**（不落库、不入仓库、不进后台设置页）。
  # 在 Google Cloud Console 建「OAuth 2.0 客户端 ID（Web 应用）」，并把每个常用域名的
  # {scheme}://{host}/google/auth/redirect 登记到「已获授权的重定向 URI」里，例如
  #   https://xiezitai.cn/google/auth/redirect
  #   https://www.xiezitai.cn/google/auth/redirect
  # 变量名**只认这一种写法**：XIEZITAI_GOOGLE_CLIENT_ID / XIEZITAI_GOOGLE_CLIENT_SECRET。
  # .env 里写它、五份 compose 也照这个名字透传进容器，裸机 / JAR 直跑同样用这个名字。
  # ⚠️ 不要用连字符写法（GOOGLE-XIEZITAI-CLIENT_ID）——它既不是合法的环境变量名，compose 的
  #    `${}` 插值还会把 `-` 当成分隔符截断，所以不做任何别名回退。
  google:
    client-id: ${XIEZITAI_GOOGLE_CLIENT_ID:}
    client-secret: ${XIEZITAI_GOOGLE_CLIENT_SECRET:}
    # 端点默认就是 Google 官方地址；自测 / 私有化部署时可以指到本机 mock
    auth-uri: ${XIEZITAI_GOOGLE_AUTH_URI:https://accounts.google.com/o/oauth2/v2/auth}
    token-uri: ${XIEZITAI_GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
    api-base: ${XIEZITAI_GOOGLE_API_BASE:https://www.googleapis.com/blogger/v3}
    # 回调地址；留空则按「发起授权那一刻的请求」推导（X-Forwarded-Proto/Host 优先，
    # 这样同一个站点挂在多个域名下时，各自都能对上自己登记的 redirect_uri）
    redirect-uri: ${XIEZITAI_GOOGLE_REDIRECT_URI:}
  # Blogger 导入：来源站点**自身文件**的单文件上限，默认 64MB
  blogger-import:
    max-media-bytes: ${XIEZITAI_BLOGGER_MAX_MEDIA_BYTES:67108864}
  # 哪些域名算「Blogger 来源站点自身」——这些域名下的图/附件会被下载落盘到本站媒体库，
  # 其余第三方图床一律保留外链（按主机后缀匹配，含子域）
  blogger-media-hosts: ${XIEZITAI_BLOGGER_MEDIA_HOSTS:blogspot.com,googleusercontent.com,ggpht.com}
  # 首次启动时写入 sys_configs 的 AI 默认值（已存在则不改，后台可随时覆盖）
  # 申请大模型额度：https://www.modelscope.cn/register?inviteCode=freetoken2208&invitorName=AIDever
  ai:
    base-url: ${XIEZITAI_AI_BASE_URL:https://api-inference.modelscope.cn/v1}
    api-key: ${XIEZITAI_AI_API_KEY:ms-3b66a440-b839-473f-b5b9-e44ee66b23d4}
    model: ${XIEZITAI_AI_MODEL:Qwen/Qwen3.8-27B}
    image-model: ${XIEZITAI_AI_IMAGE_MODEL:Qwen/Qwen-Image-2.1}

logging:
  level:
    cn.xiezitai: INFO
