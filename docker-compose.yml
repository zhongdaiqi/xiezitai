version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: xiezitai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootroot}
      MYSQL_DATABASE: xiezitai
      MYSQL_USER: xiezitai
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xiexiexie}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  app:
    build: .
    container_name: xiezitai-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: xiezitai
      MYSQL_USER: xiezitai
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xiexiexie}
      # 连接串由 MYSQL_* 拼装（内置默认 characterEncoding=UTF-8）。
      # 要整条覆盖连接串才取消下面这行注释（characterEncoding 只能写 UTF-8）：
      # SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      XIEZITAI_JWT_SECRET: ${XIEZITAI_JWT_SECRET:-please-change-me-0123456789abcdef}
      XIEZITAI_UPLOAD_DIR: /app/data/uploads
      XIEZITAI_SITE_URL: ${XIEZITAI_SITE_URL:-https://xiezitai.cn}
      # 谷歌 Blogger 集成（可选）：OAuth 2.0 客户端凭据。.env 里的键名是**连字符**写法：
      #   GOOGLE-XIEZITAI-CLIENTID=xxxxxxxx.apps.googleusercontent.com
      #   GOOGLE-XIEZITAI-CLIENT_SECRET=GOCSPX-xxxxxxxx
      # 仓库里没有也不会写真实的 id / secret；后台接口同样永不回显（只回「是否已配置」）。
      GOOGLE_XIEZITAI_CLIENTID: ${GOOGLE-XIEZITAI-CLIENTID:-}
      GOOGLE_XIEZITAI_CLIENT_SECRET: ${GOOGLE-XIEZITAI-CLIENT_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  mysql-data:
  app-data:
