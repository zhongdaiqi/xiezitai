version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: xiezitai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootroot}
      MYSQL_DATABASE: xiezitai
      MYSQL_USER: xiezitai
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xiexiexie}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  app:
    build: .
    container_name: xiezitai-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: xiezitai
      MYSQL_USER: xiezitai
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xiexiexie}
      # 连接串由 MYSQL_* 拼装（内置默认 characterEncoding=UTF-8）。
      # 要整条覆盖连接串才取消下面这行注释（characterEncoding 只能写 UTF-8）：
      # SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      XIEZITAI_JWT_SECRET: ${XIEZITAI_JWT_SECRET:-please-change-me-0123456789abcdef}
      XIEZITAI_UPLOAD_DIR: /app/data/uploads
      XIEZITAI_SITE_URL: ${XIEZITAI_SITE_URL:-https://xiezitai.cn}
      # 谷歌 Blogger 集成（可选）：OAuth 2.0 客户端凭据。.env 里的键名：
      #   XIEZITAI_GOOGLE_CLIENT_ID=xxxxxxxx.apps.googleusercontent.com
      #   XIEZITAI_GOOGLE_CLIENT_SECRET=GOCSPX-xxxxxxxx
      # 旧名 GOOGLE_XIEZITAI_CLIENT_ID / _SECRET 仍兼容（靠下面的嵌套默认值兜底），
      # 但不要用连字符写法，原因见 .env.example。
      # 这里两个值都缺省为空 = 后台显示「未配置 Google OAuth 客户端」，与不传等价，
      # 所以可以安全地写「默认空值」（不像上面 AI 那组会顶掉镜像内置默认）。
      # 仓库里没有也不会写真实的 id / secret；后台接口同样永不回显（只回「是否已配置」）。
      XIEZITAI_GOOGLE_CLIENT_ID: ${XIEZITAI_GOOGLE_CLIENT_ID:-${GOOGLE_XIEZITAI_CLIENT_ID:-}}
      XIEZITAI_GOOGLE_CLIENT_SECRET: ${XIEZITAI_GOOGLE_CLIENT_SECRET:-${GOOGLE_XIEZITAI_CLIENT_SECRET:-}}
    ports:
      - "8080:8080"
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  mysql-data:
  app-data:
